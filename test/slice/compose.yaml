name: mikan-slice

services:
  node:
    build: {context: ../.., dockerfile: Dockerfile}
    image: mikan:slice
    entrypoint: ["/usr/local/bin/mikan-node"]
    environment:
      MIKAN_DATA_DIR: /data/node
      # the test target lives on a private docker network
      MIKAN_ALLOW_PRIVATE: "true"
    volumes: ["data:/data", "run:/run/mikan"]
    # The panel takes a public host only as an IP or a full domain name.
    networks:
      default:
        aliases: [node.test]
      isp2:
        aliases: [node.test]

  panel:
    image: mikan:slice
    depends_on:
      node: {condition: service_started}
      postgres: {condition: service_healthy}
    environment:
      MIKAN_DATA_DIR: /data/panel
      MIKAN_PANEL_LISTEN: 0.0.0.0:2053
      MIKAN_DATABASE_URL: postgresql://mikan:${MIKAN_TEST_POSTGRES_PASSWORD:?set test database password}@localhost/mikan?host=/run/postgresql
      # The automatic moves' windows in seconds instead of half hours.
      MIKAN_AUTOTUNE_SCALE: "0.01"
    volumes: ["data:/data", "run:/run/mikan", "pg-run:/run/postgresql"]
    networks: [default, isp2]

  # As the installer runs it (installer/src/docker.rs): no network, the panel talks to it
  # over the shared unix socket with a scram-sha-256 password.
  postgres: &postgres
    image: postgres:18-alpine
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: mikan
      POSTGRES_DB: mikan
      POSTGRES_PASSWORD: ${MIKAN_TEST_POSTGRES_PASSWORD:?set test database password}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    command: ["postgres", "-c", "listen_addresses=", "-c", "unix_socket_directories=/run/postgresql", "-c", "unix_socket_permissions=0777"]
    volumes: ["pg-data:/var/lib/postgresql", "pg-run:/run/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/run/postgresql", "-U", "mikan", "-d", "mikan"]
      interval: 2s
      timeout: 5s
      retries: 60

  # A remote node: the panel reaches it over mTLS by the name it was added with.
  node2:
    image: mikan:slice
    entrypoint: ["sh", "-c", "MIKAN_NODE_JOIN=$$(cat /work/node2.key) exec /usr/local/bin/mikan-node"]
    environment:
      MIKAN_DATA_DIR: /data/node
      MIKAN_ALLOW_PRIVATE: "true"
    volumes: ["work:/work:ro", "data2:/data"]
    networks:
      default:
        aliases: [node2.slice]
    profiles: ["node2"]

  target:
    build: {context: ../.., dockerfile: test/e2e/Dockerfile}
    command: ["target"]

  client:
    image: metacubex/mihomo:v1.19.31
    command: ["-d", "/tmp/mihomo", "-f", "/work/client.yaml"]
    volumes: ["work:/work:ro"]
    profiles: ["client"]

  # A second device of the same subscription on another ISP (isp2, another /24): the
  # panel moves a port only when devices of two networks are cut off from it.
  client2:
    image: metacubex/mihomo:v1.19.31
    command: ["-d", "/tmp/mihomo", "-f", "/work/client.yaml"]
    volumes: ["work:/work:ro"]
    networks: [isp2]
    profiles: ["client2"]

  # Plays the client's ISP: inside the client's network namespace it drops the client's
  # packets to the node's 443/tcp, like the DPI that blocks one port of a server.
  blocker:
    image: alpine:3
    network_mode: "service:client"
    cap_add: [NET_ADMIN]
    entrypoint: ["sh", "-c"]
    command:
      - apk add -q iptables >/dev/null && iptables -I OUTPUT -p tcp -d "$$(getent hosts node | cut -d' ' -f1)" --dport 443 -j REJECT --reject-with tcp-reset && echo "client → node:443/tcp dropped"
    profiles: ["blocker"]

  # The same for client2's ISP.
  blocker2:
    image: alpine:3
    network_mode: "service:client2"
    cap_add: [NET_ADMIN]
    entrypoint: ["sh", "-c"]
    command:
      - apk add -q iptables >/dev/null && iptables -I OUTPUT -p tcp -d "$$(getent hosts node | cut -d' ' -f1)" --dport 443 -j REJECT --reject-with tcp-reset && echo "client2 → node:443/tcp dropped"
    profiles: ["blocker2"]

  driver:
    image: golang:1.27
    working_dir: /src
    command: ["sleep", "infinity"]
    volumes:
      - "../..:/src:ro"
      - "work:/work"
      # The panel's self-signed certificate (data/panel/tls/self.crt), the one TLS is checked by.
      - "data:/data:ro"
      - "mikan-gomod:/go/pkg/mod"
      - "mikan-gocache:/root/.cache/go-build"
    networks: [default, isp2]

  # The core's egress guard (guard.sh), on a stack of its own: the panel shares the node's
  # network as the installer has them share the server's, and MIKAN_ALLOW_PRIVATE is not set.
  guard-node:
    image: mikan:slice
    entrypoint: ["/usr/local/bin/mikan-node"]
    environment:
      MIKAN_DATA_DIR: /data/node
    volumes: ["guard-data:/data", "guard-run:/run/mikan"]
    networks:
      public:
        aliases: [guard.test]
    profiles: ["guard"]

  guard-panel:
    image: mikan:slice
    network_mode: "service:guard-node"
    depends_on:
      guard-node: {condition: service_started}
      guard-postgres: {condition: service_healthy}
    environment:
      MIKAN_DATA_DIR: /data/panel
      MIKAN_PANEL_LISTEN: 0.0.0.0:2053
      MIKAN_DATABASE_URL: postgresql://mikan:${MIKAN_TEST_POSTGRES_PASSWORD:?set test database password}@localhost/mikan?host=/run/postgresql
      # Port 80 is the web server's below.
      MIKAN_ACME_LISTEN: 127.0.0.1:8088
    volumes: ["guard-data:/data", "guard-run:/run/mikan", "guard-pg-run:/run/postgresql"]
    profiles: ["guard"]

  guard-postgres:
    <<: *postgres
    volumes: ["guard-pg-data:/var/lib/postgresql", "guard-pg-run:/run/postgresql"]
    profiles: ["guard"]

  # What else listens on that server, each answering with what it gets: a web server, and
  # two services a firewall would close from outside.
  guard-server:
    image: alpine:3
    network_mode: "service:guard-node"
    entrypoint: ["sh", "-c"]
    command:
      - for port in 80 5432 5433; do nc -lk -p "$$port" -e /bin/cat & done; wait
    profiles: ["guard"]

  guard-client:
    image: metacubex/mihomo:v1.19.31
    command: ["-d", "/tmp/mihomo", "-f", "/work/client.yaml"]
    volumes: ["guard-work:/work:ro"]
    networks: [public]
    profiles: ["guard"]

  guard-driver:
    image: golang:1.27
    working_dir: /src
    command: ["sleep", "infinity"]
    environment:
      SLICE_PANEL: guard.test:2053
    volumes:
      - "../..:/src:ro"
      - "guard-work:/work"
      - "guard-data:/data:ro"
      - "mikan-gomod:/go/pkg/mod"
      - "mikan-gocache:/root/.cache/go-build"
    networks: [public]
    profiles: ["guard"]

networks:
  default: {}
  isp2:
    ipam:
      config: [{subnet: 10.77.2.0/24}]
  # Addresses the core takes for public (11.0.0.0/8 is not private or reserved), and nothing
  # outside the stack is reached on them.
  public:
    ipam:
      config: [{subnet: 11.77.0.0/24}]

volumes:
  pg-data: {}
  pg-run: {}
  data: {}
  data2: {}
  run: {}
  work: {}
  guard-pg-data: {}
  guard-pg-run: {}
  guard-data: {}
  guard-run: {}
  guard-work: {}
  mikan-gomod: {external: true}
  mikan-gocache: {external: true}
