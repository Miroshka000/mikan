name: release

# A tag vX.Y.Z.R on main publishes a release (legacy vX.Y.Z is accepted):
#   - the image to GitHub Packages (ghcr.io/<owner>/mikan), amd64 and arm64;
#   - the installer for x86_64 and aarch64;
#   - manifest.json signed with the release key (RELEASE_SIGNING_KEY), which the panel's
#     update check and the installer trust, and install.sh for the one-line install;
#   - the release's entry in the signed release index (index.json on the "updates"
#     pre-release), where updaters look first; "from" comes from .github/upgrade-from.
# A stable manifest must pass the legacy contract (mikan-release legacy-check) before it
# is published: mikan 0.4.5 and 0.5.0.0 read "latest" and nothing else.
# The image is pushed under its version only; :latest moves to it after the release is
# published (job latest), so a failed installer build or signature leaves :latest where it
# was. A pre-release tag (vX.Y.Z.R-rc.N) is published as a pre-release and does not move it.
# A release that needs a newer host installer names it in .github/min-installer (absent
# by default, see cmd/mikan-release).
#
# The signing key reaches a job that runs this repository's code, so the code that runs is
# the code of main: a tag on any other commit stops at the first job (guard), before any
# job that builds, signs or publishes. A pre-release may also come from dev (a beta to try
# what is merged there before main): it goes to the beta channel only, and only servers
# that chose beta take it. Every action is pinned to a commit (the comment is
# the version it was); dependabot (.github/dependabot.yml) proposes the updates. Each job
# has the permissions it needs and no more.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tagged commit is on main (a pre-release on main or dev)
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $GITHUB_REF_NAME"
            exit 1
          fi
          branches="main"
          case "$GITHUB_REF_NAME" in *-*) branches="main dev" ;; esac
          for b in $branches; do
            git fetch --no-tags origin "$b"
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$b"; then
              exit 0
            fi
          done
          echo "::error::$GITHUB_REF_NAME is on a commit that is not on $branches: a release is made from main, a pre-release from main or dev"
          exit 1

  test:
    needs: guard
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mikan_test
          POSTGRES_PASSWORD: mikan_test
          POSTGRES_DB: mikan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mikan_test -d mikan_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      MIKAN_TEST_DATABASE_URL: postgres://mikan_test:mikan_test@localhost:5432/mikan_test?sslmode=disable
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # The repository key is trusted only with the fingerprint the PostgreSQL project
      # publishes (wiki.postgresql.org/wiki/Apt), and only as the one key in the file.
      - name: PostgreSQL 18 backup tools
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          fpr=$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1 == "pub" {n++} $1 == "fpr" && !f {f = $10} END {if (n == 1) print f}')
          if [ "$fpr" != B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 ]; then
            echo "::error::unexpected PGDG signing key: ${fpr:-not exactly one key}"
            exit 1
          fi
          sudo install -D -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: go
        run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mikan" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Docker Hub limits anonymous pulls per runner address; with the secrets binfmt,
      # buildkit and the base images are pulled as an account.
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Base images through Google's Docker Hub mirror, Docker Hub itself when it fails.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ steps.name.outputs.version }}
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # the build record would be one more artifact of the run; publish wants only the installers
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.name.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  installer:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: installer
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-zigbuild
      - name: build
        working-directory: installer
        env:
          MIKAN_VERSION: ${{ github.ref_name }}
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.target }}
          mkdir -p ../dist && cp target/${{ matrix.target }}/release/mikan ../dist/mikan-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mikan-${{ matrix.arch }}
          path: dist/mikan-${{ matrix.arch }}

  publish:
    needs: [image, installer]
    runs-on: ubuntu-24.04
    # One release at a time writes the index: the second waits and carries the first on.
    concurrency:
      group: release-index
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: mikan-*
          merge-multiple: true
      - name: manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run ./cmd/mikan-release manifest -version "$version" \
            -image "${{ needs.image.outputs.image }}" -digest "${{ needs.image.outputs.digest }}" \
            -asset x86_64=dist/mikan-x86_64 -asset aarch64=dist/mikan-aarch64 \
            -min-installer-file .github/min-installer -out dist
          go run ./cmd/mikan-release verify dist/manifest.json
          # A stable release becomes "latest", which mikan 0.4.5 and 0.5.0.0 read for as
          # long as they run: one they would refuse stops here, before it is published.
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) go run ./cmd/mikan-release legacy-check dist/manifest.json ;;
          esac
          cp installer/install.sh dist/install.sh
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --verify-tag --title "mikan ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md \
            dist/install.sh dist/mikan-x86_64 dist/mikan-aarch64 dist/manifest.json dist/manifest.json.sig
      # The release index (internal/release/index.go) lives on the "updates" pre-release,
      # which never becomes "latest". The current index is carried on only with a valid
      # signature; when there is none yet, it starts from the releases before it. A
      # pre-release goes in as beta and leaves "latest" alone.
      - name: index
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/updates" --jq '[.assets[].name] | join(" ")' 2>"$RUNNER_TEMP/err"); then
            :
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then
            # Never made yet; a creation that fails (it exists after all) stops the job
            # before anything is overwritten.
            gh release create updates --prerelease --latest=false --target main --title "Release index" \
              --notes "The signed list of releases the mikan updaters read. Not a release: nothing to install here."
            assets=""
          else
            cat "$RUNNER_TEMP/err" >&2
            exit 1
          fi
          case " $assets " in
            *" index.json "*)
              gh release download updates -p index.json -p index.json.sig -D updates
              current="-in updates/index.json" ;;
            *) current="-seed" ;;
          esac
          # shellcheck disable=SC2086 # $current is two words or one
          go run ./cmd/mikan-release index -version "$version" -from-file .github/upgrade-from $current -out dist
          gh release upload updates dist/index.json dist/index.json.sig --clobber

  # :latest names the image of the newest published release: it moves only once the
  # release exists, and never to a pre-release. The tag points at the pushed digest, so
  # nothing is rebuilt.
  latest:
    needs: [image, publish]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag latest
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
