name: ci

# Pull requests only: dev is where work happens, a pull request into main is where it is
# checked. Nothing here publishes; releases come from tags (release.yml).
#
# Every action is pinned to a commit (the comment is the version it was), so that a moved
# tag cannot change what runs; dependabot (.github/dependabot.yml) proposes the updates.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  panel:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Google's Docker Hub mirror: Docker Hub limits anonymous pulls and has outages.
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: mikan_test
          POSTGRES_PASSWORD: mikan_test
          POSTGRES_DB: mikan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mikan_test -d mikan_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      MIKAN_TEST_DATABASE_URL: postgres://mikan_test:mikan_test@localhost:5432/mikan_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm lint
          pnpm test
          pnpm build
      # web/src/api/openapi.json is what the admin's types (schema.d.ts), the SDKs (sdk/) and
      # the docs' API reference are made from, and it is exported with the panel's own
      # command. It must say what the code says: a change of the API that leaves it behind
      # fails here, with the difference and the commands that bring it up to date. The
      # build above made web/dist, which the command's package embeds.
      - name: openapi.json is what the code exports
        run: |
          go run ./cmd/mikan openapi > "$RUNNER_TEMP/openapi.json"
          if ! diff -u web/src/api/openapi.json "$RUNNER_TEMP/openapi.json" > "$RUNNER_TEMP/openapi.diff"; then
            head -n 80 "$RUNNER_TEMP/openapi.diff"
            echo "::error file=web/src/api/openapi.json::The API changed and openapi.json did not follow. Run: go run ./cmd/mikan openapi > web/src/api/openapi.json, then pnpm api in web/, and commit both."
            exit 1
          fi
      - name: schema.d.ts is what openapi.json generates
        working-directory: web
        run: |
          pnpm api
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error file=web/src/api/schema.d.ts::schema.d.ts does not follow openapi.json. Run pnpm api in web/ and commit it."
            exit 1
          fi
      # The repository key is trusted only with the fingerprint the PostgreSQL project
      # publishes (wiki.postgresql.org/wiki/Apt), and only as the one key in the file.
      - name: PostgreSQL 18 backup tools
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          fpr=$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1 == "pub" {n++} $1 == "fpr" && !f {f = $10} END {if (n == 1) print f}')
          if [ "$fpr" != B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 ]; then
            echo "::error::unexpected PGDG signing key: ${fpr:-not exactly one key}"
            exit 1
          fi
          sudo install -D -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      # The xray JSON tests run every config through a real xray-core; without one they skip,
      # so the release pinned here (by the hash of its archive) is what they check against.
      - name: xray-core for the xray JSON checks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xray.zip" https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-64.zip
          echo "0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978  $RUNNER_TEMP/xray.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"
          echo "XRAY=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"
      # Every package, with the race detector: the panel's background writers, sync and
      # bot share state across goroutines. -race needs cgo, and the runner has gcc. The app
      # package alone takes 8 to 10 minutes under -race: past go test's 10 by default.
      - name: go
        env:
          CGO_ENABLED: "1"
        run: |
          test -z "$(gofmt -l internal cmd test)"
          go vet ./...
          go test -race -timeout 30m ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The SDKs (sdk/) from the spec in the repository, tested against a stand-in of the
  # panel: a spec the generators cannot turn into a working package fails here, not on the
  # day of a release. The panel job keeps the spec equal to the code. Nothing is published.
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdk/python/requirements.txt
      - run: sh sdk/build.sh typescript
      - run: sh sdk/build.sh python

  installer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by commit, an action that takes its toolchain from the ref needs it said.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: installer
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --locked
      # The updater takes its lock in /run, as on a server: the stand runs as root.
      - run: sudo env MIKAN_INSTALLER_TEST=1 sh test-upgrade.sh
      # The one-line install against a stand-in GitHub: the release index and its fallback.
      - run: sudo env MIKAN_INSTALLER_TEST=1 sh test-install.sh

  # The installer's dependencies against the RustSec advisory database. A new advisory
  # fails the check on the next pull request; cargo audit only reads Cargo.lock.
  installer-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: installer
          key: audit
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo audit --deny warnings

  image:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # binfmt, buildkit and the base images come through Google's Docker Hub mirror;
      # whatever still falls back to Docker Hub is pulled as the account.
      - if: env.DOCKERHUB_USERNAME != ''
        # A Docker Hub outage must not stop the build: everything comes through the mirror.
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # arm64 too: a wrong-architecture binary fails the build (see the Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Base images through Google's Docker Hub mirror, Docker Hub itself when it fails.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
