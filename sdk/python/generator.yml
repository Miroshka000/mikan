# Settings of openapi-python-client (sdk/build.sh python runs it with this file).
project_name_override: mikan-sdk
package_name_override: mikan_sdk
# The generator has no parser for an image response: it would drop it with a warning. The
# panel serves its pictures (a top-up's photo, the subscription page's images) as bytes.
content_type_overrides:
  image/*: application/octet-stream
  image/jpeg: application/octet-stream
  image/png: application/octet-stream
  image/webp: application/octet-stream
