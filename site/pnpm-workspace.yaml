allowBuilds:
  # esbuild ships its binary as an optional dependency; its install script only checks it.
  esbuild: false
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.12.0'
  - '@astrojs/markdown-satteri@0.4.3'
  - astro@7.3.6

overrides:
  # postcss-nested 6 pins postcss-selector-parser 6: quadratic flat selector parsing, fixed in 7.1.6.
  postcss-selector-parser: ^7.1.6
