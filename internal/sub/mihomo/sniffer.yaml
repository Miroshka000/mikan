# The sniffer of a profile whose admin turned it on (routing.Tune.Sniffer), under the key
# sniffer: the site's name read from the connection, so that rules by domain work for
# apps that connect by IP.
enable: true
parse-pure-ip: true
sniff:
  HTTP:
    ports: [80, 8080-8880]
  QUIC:
    ports: [443, 8443]
  TLS:
    ports: [443, 8443]
