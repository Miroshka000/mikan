# privWL-clash by Nemu-x (https://github.com/Nemu-x/privWL-clash): everything goes through
# the VPN except Russian apps and sites (banks, state services, marketplaces), which need a
# Russian address and go direct. The lists (MIT) are linked, not copied, and pinned to a
# commit: a push to their repository cannot reroute the apps until the admin moves the pin.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
proxy-groups:
  - name: VPN
    type: select
    proxies: [Auto]
    include-all-proxies: true
  - name: Auto
    type: url-test
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
rule-providers:
  privwl-ru-apps:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/process-direct-apk.yaml
    path: ./ruleset/privwl-ru-apps.yaml
    interval: 86400
  privwl-ru-pc:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/process-direct-pc.yaml
    path: ./ruleset/privwl-ru-pc.yaml
    interval: 86400
  privwl-ru-sites:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/domain-direct-suffix.yaml
    path: ./ruleset/privwl-ru-sites.yaml
    interval: 86400
  privwl-ru-keywords:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/domain-direct-keyword.yaml
    path: ./ruleset/privwl-ru-keywords.yaml
    interval: 86400
  privwl-ru-core:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/ru-core.yaml
    path: ./ruleset/privwl-ru-core.yaml
    interval: 86400
rules:
  - RULE-SET,privwl-ru-apps,DIRECT
  - RULE-SET,privwl-ru-pc,DIRECT
  - RULE-SET,privwl-ru-sites,DIRECT
  - RULE-SET,privwl-ru-keywords,DIRECT
  - RULE-SET,privwl-ru-core,DIRECT
  - MATCH,VPN
