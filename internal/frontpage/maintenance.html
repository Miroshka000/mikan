<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>[[t "title"]]</title>
<style>
  :root { color-scheme: light dark; --bg: [[c "#f7f6f3"]]; --ink: [[c "#1c1f24"]]; --muted: [[c "#5b6470"]]; --line: [[c "#dcdad4"]]; --accent: [[c "#1f5fbf"]]; --done: [[c "#2d7a4f"]]; }
  @media (prefers-color-scheme: dark) { :root { --bg: [[c "#121417"]]; --ink: [[c "#e9ebee"]]; --muted: [[c "#9aa3ad"]]; --line: [[c "#2a2e34"]]; --accent: [[c "#7fb0f5"]]; --done: [[c "#6cc494"]]; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .[[id "wrap"]] { width: min([[n "width"]]px, 100% - [[n "pad"]]px * 2); margin-inline: auto; min-height: 100vh; display: flex; flex-direction: column; }
  header, footer { display: flex; justify-content: space-between; gap: 16px; padding-block: [[n "pad"]]px; color: var(--muted); font-size: 14px; }
  header { border-bottom: 1px solid var(--line); }
  footer { margin-top: auto; border-top: 1px solid var(--line); }
  header b { color: var(--ink); font-weight: 600; }
  main { padding-block: [[n "gap"]]px; }
  .[[id "state"]] { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 16px; color: var(--accent); font-size: 14px; font-weight: 600; }
  .[[id "state"]]::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; animation: [[id "pulse"]] [[n "glide"]]s ease-in-out infinite; }
  @keyframes [[id "pulse"]] { 50% { opacity: 0.35; } }
  h1 { margin: 0 0 16px; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }
  .[[id "lead"]] { margin: 0; max-width: 52ch; color: var(--muted); font-size: 19px; }
  .[[id "steps"]] { list-style: none; margin: [[n "gap"]]px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .[[id "steps"]] li { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .[[id "steps"]] span { flex: none; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .[[id "steps"]] .[[id "done"]] span { color: var(--done); }
  .[[id "steps"]] .[[id "now"]] { font-weight: 600; }
  .[[id "steps"]] .[[id "now"]] span { color: var(--accent); font-weight: 600; }
  .[[id "steps"]] .[[id "now"]]::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: 32%; background: var(--accent); animation: [[id "slide"]] [[n "glide"]]s ease-in-out infinite alternate; }
  @keyframes [[id "slide"]] { to { left: 68%; } }
  .[[id "thanks"]] { margin: 24px 0 0; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .[[id "state"]]::before, .[[id "steps"]] .[[id "now"]]::after { animation: none; } .[[id "steps"]] .[[id "now"]]::after { width: 100%; } }
</style>
</head>
<body>
<div class="[[id "wrap"]]">
  <header><b>[[t "head"]]</b><span>[[t "label"]]</span></header>
  <main>
    <p class="[[id "state"]]">[[t "label"]]</p>
    <h1>[[t "title"]]</h1>
    <p class="[[id "lead"]]">[[t "body"]]</p>
    <ol class="[[id "steps"]]" aria-label="[[t "plan"]]">
      <li class="[[id "done"]]">[[t "step.a"]]<span>[[t "state.a"]]</span></li>
      <li class="[[id "now"]]">[[t "step.b"]]<span>[[t "state.b"]]</span></li>
      <li>[[t "step.c"]]<span>[[t "state.c"]]</span></li>
    </ol>
    <p class="[[id "thanks"]]">[[t "thanks"]]</p>
  </main>
  <footer><span>[[t "foot"]]</span></footer>
</div>
</body>
</html>
