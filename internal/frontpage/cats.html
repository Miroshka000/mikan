<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[t "title"]]</title>
<style>
  :root { color-scheme: light dark; --bg: [[c "#fff7ef"]]; --card: [[c "#fff"]]; --ink: [[c "#2b211b"]]; --muted: [[c "#7a6a5e"]]; --line: [[c "#f0e2d4"]]; --accent: [[c "#f08a24"]]; --accent-ink: [[c "#fff"]]; }
  @media (prefers-color-scheme: dark) { :root { --bg: [[c "#17120e"]]; --card: [[c "#1f1914"]]; --ink: [[c "#f3e9df"]]; --muted: [[c "#b3a294"]]; --line: [[c "#2e251d"]]; --accent: [[c "#f59a3c"]]; --accent-ink: [[c "#1b130c"]]; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }
  main { width: min([[n "width"]]px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: [[n "radius"]]px; padding: 24px; text-align: center; }
  h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; }
  .[[id "count"]] { margin: 8px 0 0; font-size: 40px; line-height: 48px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .[[id "rate"]] { margin: 0; color: var(--muted); font-size: 13px; }
  .[[id "cat"]] { position: relative; display: block; margin: 16px auto; width: [[n "size"]]px; height: [[n "size"]]px; border: 0; border-radius: 50%; background: var(--bg); font-size: 120px; line-height: [[n "size"]]px; cursor: pointer; transition: transform 0.08s; }
  .[[id "cat"]]:hover { transform: scale(1.04); }
  .[[id "cat"]]:active { transform: scale(0.94); }
  .[[id "cat"]]:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .[[id "pop"]] { position: absolute; left: 50%; top: 24px; font-size: 20px; font-weight: 700; color: var(--accent); pointer-events: none; animation: [[id "up"]] 0.8s ease-out forwards; }
  @keyframes [[id "up"]] { to { transform: translate(-50%, -64px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .[[id "pop"]] { animation-duration: 0.01s; } .[[id "cat"]] { transition: none; } }
  .[[id "shop"]] { display: grid; gap: 8px; margin-top: 8px; }
  .[[id "shop"]] button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 8px 16px; border: 1px solid var(--line); border-radius: [[n "radius.small"]]px; background: var(--card); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .[[id "shop"]] button:hover:not(:disabled) { border-color: var(--accent); }
  .[[id "shop"]] button:disabled { opacity: 0.48; cursor: not-allowed; }
  .[[id "shop"]] b { white-space: nowrap; color: var(--accent); }
  .[[id "shop"]] span small { display: block; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>[[t "title"]]</h1>
  <p class="[[id "count"]]" id="[[id "count"]]" aria-live="polite">0</p>
  <p class="[[id "rate"]]" id="[[id "rate"]]">[[t "hint"]]</p>
  <button class="[[id "cat"]]" id="[[id "cat"]]" type="button" aria-label="[[t "pet"]]"><span id="[[id "face"]]">🐱</span></button>
  <div class="[[id "shop"]]" id="[[id "shop"]]"></div>
</main>
<script>
(function () {
  var items = [
    { id: "paw", name: "[[t "paw"]]", note: "+1 treat per pet", cost: [[n "cost.a"]], per: 1, auto: 0 },
    { id: "yarn", name: "[[t "yarn"]]", note: "+1 treat every second", cost: [[n "cost.b"]], per: 0, auto: 1 },
    { id: "kitten", name: "[[t "kitten"]]", note: "+5 treats every second", cost: [[n "cost.c"]], per: 0, auto: 5 },
    { id: "tower", name: "[[t "tower"]]", note: "+25 treats every second", cost: [[n "cost.d"]], per: 0, auto: 25 }
  ];
  var cats = ["🐱", "😺", "😸", "😻", "😽"];
  var s = { treats: 0, have: {} };
  try { s = JSON.parse(localStorage.getItem("[[t "store"]]")) || s; } catch (e) {}
  s.have = s.have || {};
  function [[id "save"]]() { try { localStorage.setItem("[[t "store"]]", JSON.stringify(s)); } catch (e) {} }
  function [[id "owned"]](id) { return s.have[id] || 0; }
  function [[id "price"]](it) { return Math.ceil(it.cost * Math.pow([[n "growth"]], [[id "owned"]](it.id))); }
  function [[id "perPet"]]() { return 1 + items.reduce(function (a, it) { return a + it.per * [[id "owned"]](it.id); }, 0); }
  function [[id "perSec"]]() { return items.reduce(function (a, it) { return a + it.auto * [[id "owned"]](it.id); }, 0); }
  var face = document.getElementById("[[id "face"]]"), count = document.getElementById("[[id "count"]]"), rate = document.getElementById("[[id "rate"]]"), cat = document.getElementById("[[id "cat"]]"), shop = document.getElementById("[[id "shop"]]");
  function [[id "render"]]() {
    count.textContent = Math.floor(s.treats).toLocaleString();
    var ps = [[id "perSec"]]();
    rate.textContent = ps ? ps + " treats per second · " + [[id "perPet"]]() + " per pet" : "[[t "hint"]]";
    face.textContent = cats[Math.min(cats.length - 1, Math.floor(Math.log10(1 + s.treats)))];
    Array.prototype.forEach.call(shop.children, function (b, i) {
      var it = items[i];
      b.disabled = s.treats < [[id "price"]](it);
      b.querySelector("b").textContent = [[id "price"]](it).toLocaleString();
      b.querySelector("small").textContent = it.note + ([[id "owned"]](it.id) ? " · own " + [[id "owned"]](it.id) : "");
    });
  }
  items.forEach(function (it) {
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = "<span>" + it.name + "<small></small></span><b></b>";
    b.addEventListener("click", function () {
      var p = [[id "price"]](it);
      if (s.treats < p) return;
      s.treats -= p;
      s.have[it.id] = [[id "owned"]](it.id) + 1;
      [[id "save"]]();
      [[id "render"]]();
    });
    shop.appendChild(b);
  });
  cat.addEventListener("click", function () {
    var n = [[id "perPet"]]();
    s.treats += n;
    var pop = document.createElement("span");
    pop.className = "[[id "pop"]]";
    pop.textContent = "+" + n;
    cat.appendChild(pop);
    setTimeout(function () { pop.remove(); }, 800);
    [[id "save"]]();
    [[id "render"]]();
  });
  setInterval(function () { var ps = [[id "perSec"]](); if (ps) { s.treats += ps / [[n "tick.per"]]; [[id "render"]](); } }, [[n "tick"]]);
  setInterval([[id "save"]], [[n "keep"]]);
  [[id "render"]]();
})();
</script>
</body>
</html>
